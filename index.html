<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#161616" />
    <title>Sealbook</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-bWvB/7NmBxnB1Imix/q1M0l4IJrxsBH/YpEKlm/wGHM='; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <style>
      /*
       * Shown until React's first commit, which clears #root. The app does not
       * render at all until the crypto module has been fetched and
       * initialised, so without this the document stays blank for the length
       * of that download.
       */
      html {
        background: #161616;
      }

      #sb-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 0 1.25rem;
        text-align: center;
        background: #161616;
        color: #8f8f8f;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        font-size: 0.875rem;
      }

      #sb-splash p {
        margin: 0;
      }

      /*
       * Decorative: the reduced-motion rule in index.css stops this animation,
       * so the label beside it is what carries the state.
       */
      #sb-splash-ring {
        width: 1.75rem;
        height: 1.75rem;
        border: 2px solid #2c2c2c;
        border-top-color: #8f8f8f;
        border-radius: 50%;
        animation: sb-splash-spin 0.8s linear infinite;
      }

      @keyframes sb-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }

      #sb-splash-noscript {
        display: none;
      }
    </style>
    <noscript>
      <style>
        #sb-splash-ring,
        #sb-splash-label {
          display: none;
        }

        #sb-splash-noscript {
          display: block;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root">
      <div id="sb-splash" role="status">
        <div id="sb-splash-ring" aria-hidden="true"></div>
        <p id="sb-splash-label">Starting Sealbook…</p>
        <p id="sb-splash-noscript">Sealbook needs JavaScript to run.</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
