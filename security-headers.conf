# Security headers applied to every response.
#
# Kept outside conf.d/ because nginx auto-includes conf.d/*.conf at http
# level, which would load this file a second time on its own.
#
# This lives in its own file because nginx's `add_header` does not merge across
# levels: a block that sets any `add_header` of its own discards every one
# inherited from its parent. Since each location below needs its own
# Cache-Control, each must also restate the security headers, so they are kept
# here once and included rather than copied six times and drifting.
#
# connect-src stays broad because the user chooses which Sealbook server to talk
# to, so the API origin is not known at build time.
add_header Content-Security-Policy "default-src 'self' blob:; script-src 'self' 'wasm-unsafe-eval' 'sha256-bWvB/7NmBxnB1Imix/q1M0l4IJrxsBH/YpEKlm/wGHM='; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https: wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), interest-cohort=()" always;

# HSTS belongs on whatever terminates TLS in front of this container. This
# server listens on plain HTTP, so asserting it here would claim an guarantee it
# cannot itself provide. Uncomment only if you terminate TLS in this container.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
