server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The stock nginx.conf leaves gzip off, so without this the bundle and the
    # 892K crypto module are served raw to every first-time visitor.
    #
    # gzip_static serves the .gz files the Docker build writes next to each
    # asset, so nothing is compressed per request. gzip below is the fallback
    # for anything that was not precompressed, and gzip_vary marks both so a
    # proxy in front cannot hand a gzipped body to a client that did not ask
    # for one. Fonts and images are already compressed and are left alone.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        text/css
        text/plain;

    # Every response is served by one of the locations below, and each includes
    # the shared security headers. See security-headers.conf for why they are
    # repeated per location rather than set once here.

    # Vite emits content-hashed filenames, so these can be cached indefinitely:
    # a new build produces new names rather than needing revalidation.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The service worker decides when a client picks up a new build, so it must
    # never come from cache. A stale sw.js pins every visitor to the previous
    # release until it happens to expire.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The SPA entry point is revalidated on every load; it is what points at the
    # current hashed bundle.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
