name: CI

on:
  push:
  pull_request:

# The WebAssembly package in src/pkg is built from the sealbook repository and
# is not committed here. The protocol suites import it directly, so the tests
# need it as much as the typecheck and the bundle do, and the build job below
# runs the same wasm-pack command as sealbook-web/Dockerfile before any of them.
#
# SEALBOOK_REPO_TOKEN must be a token with read access to the contents of the
# sealbook repository: both repositories are private and the default
# GITHUB_TOKEN is scoped to this one. scripts/build-wasm.sh resolves the crate
# at ../sealbook, which is why both checkouts are given an explicit path.
# sealbook is checked out at the commit in sealbook.pin, since the build fails
# on any other.

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sealbook-web
    steps:
      - uses: actions/checkout@v4
        with:
          path: sealbook-web

      - name: Read the sealbook pin
        id: pin
        working-directory: sealbook-web
        run: echo "sha=$(grep -v '^[[:space:]]*#' sealbook.pin | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: silent-sphinx/sealbook
          path: sealbook
          ref: ${{ steps.pin.outputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.SEALBOOK_REPO_TOKEN }}

      - name: The sealbook pin is on a published branch
        working-directory: sealbook
        run: |
          for branch in main v2; do
            git merge-base --is-ancestor HEAD "origin/$branch" && exit 0
          done
          echo "::error::the sealbook pin is on neither main nor v2"
          exit 1

      - name: No host logic that belongs in core
        run: ../sealbook/scripts/check-host-boundaries.sh --strict src

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          workspaces: sealbook

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sealbook-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Needs neither the wasm package nor the toolchain that builds it, so it
      # runs ahead of both. Warnings are reported without failing the job; see
      # the backlog noted in .oxlintrc.json.
      - name: Lint
        run: npm run lint

      - name: Build the WebAssembly package
        run: npm run wasm

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npx tsc -b

      - name: Build the bundle
        run: npx vite build

  # The browser extension imports this repo's `src/lib` modules directly, by
  # path, through a Vite alias. That directory has no public-API contract, so a
  # rename here breaks that repo with no warning in the pull request that caused
  # it. Building it from this workflow is what makes the break land here.
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sealbook-firefox
    steps:
      - uses: actions/checkout@v4
        with:
          path: sealbook-web

      # The extension branch of the same name, so v2 web is checked against v2 Firefox.
      - name: Pick the extension branch
        id: ext
        working-directory: .
        env:
          TOKEN: ${{ secrets.SEALBOOK_REPO_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/silent-sphinx/sealbook-firefox"
          if git ls-remote --exit-code --heads "$url" "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          repository: silent-sphinx/sealbook-firefox
          path: sealbook-firefox
          ref: ${{ steps.ext.outputs.ref }}
          token: ${{ secrets.SEALBOOK_REPO_TOKEN }}

      - name: Read the sealbook pin
        id: pin
        working-directory: sealbook-web
        run: echo "sha=$(grep -v '^[[:space:]]*#' sealbook.pin | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: silent-sphinx/sealbook
          path: sealbook
          ref: ${{ steps.pin.outputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.SEALBOOK_REPO_TOKEN }}

      - name: The sealbook pin is on a published branch
        working-directory: sealbook
        run: |
          for branch in main v2; do
            git merge-base --is-ancestor HEAD "origin/$branch" && exit 0
          done
          echo "::error::the sealbook pin is on neither main nor v2"
          exit 1

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          workspaces: sealbook

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sealbook-firefox/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the WebAssembly package
        run: npm run wasm

      - name: Typecheck the extension against this checkout
        run: npx tsc -b

      - name: Build the extension
        run: npx vite build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Development-only advisories should not fail the build; what ships to a
      # browser is what matters.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
